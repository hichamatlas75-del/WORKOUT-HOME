<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="800 300" opacity="0.85" filter="url(#shadow)"/>
  
  <!-- Inner Ring & Tick Marks -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="6 14"/>

  <!-- Center Lightning / Fitness Symbol & "17" -->
  <g transform="translate(0, -10)">
    <!-- Stylized 17 -->
    <text x="256" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="118" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-4">17</text>
    <text x="256" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="url(#accent)" text-anchor="middle" letter-spacing="6">FULL BODY</text>
    <text x="256" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="3">17:00 • QUOTIDIEN</text>
  </g>

  <!-- Mini Flame / Energy Indicator at bottom -->
  <circle cx="256" cy="410" r="10" fill="#10b981" filter="url(#shadow)"/>
</svg>
